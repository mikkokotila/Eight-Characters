<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F5F0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1916" media="(prefers-color-scheme: dark)">
<title>Not found · Eightchord</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/static/favicon.svg?v={{ app_version }}" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css?v={{ app_version }}">
</head>
<body>
<!-- An address the app does not have (main.py, not_found_page): the website's own words
     for its 404, in the start page's header. -->
<main class="input-container not-found">
  <div class="input-header">
    <p class="eyebrow">Eightchord</p>
    <h1 class="title">This page is not here.</h1>
  </div>
  <p class="not-found-line">It may have moved, or it never was.</p>
  <p class="not-found-home"><a href="/">Go to the home page</a></p>
</main>
</body>
</html>
