<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="page_title">BaZi — Neljä pilaria</title>
<link rel="preload" href="/explorer/vendor/fonts/Manrope-normal-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/explorer/vendor/fonts/CormorantGaramond-normal-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css?v={{ app_version }}">
</head>
<body>

<!-- ═══════════════════════════════════════════════════
     VIEW 1 — INPUT FORM
     ═══════════════════════════════════════════════════ -->
<div id="input-view" class="input-container">

  <div class="input-header">
    <div class="language-switch">
      <button type="button" class="lang-btn" data-lang="fi">FI</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>
    <div class="mode-switch">
      <button type="button" class="mode-btn is-active" data-mode="standard" data-i18n="mode_standard">Standardi</button>
      <button type="button" class="mode-btn" data-mode="evolution" data-i18n="mode_evolution">Evoluutio</button>
    </div>
    <p class="eyebrow" data-i18n="heading">Neljä pilaria</p>
    <h1 class="title" data-i18n="title">Kahdeksan merkkiä</h1>
  </div>

  <!-- Validated by app.js, so messages follow the page language. -->
  <form id="chart-form" novalidate>

    <!-- Date, Time, Location -->
    <div class="datetime-row">
      <div class="field-group">
        <label for="date" data-i18n="label_date">Syntymäpäivä</label>
        <input type="date" id="date" name="date" min="{{ birth_date_min }}" max="{{ birth_date_max }}" aria-describedby="date-status" required>
        <div id="date-status" class="field-status" aria-live="polite"></div>
      </div>
      <div class="field-group">
        <label for="time" data-i18n="label_time">Kellonaika</label>
        <input type="time" id="time" name="time" aria-describedby="time-status" required>
        <div id="time-status" class="field-status" aria-live="polite"></div>
      </div>
      <div class="field-group location-group">
        <label for="location" id="location-label" data-i18n="label_location">Syntymäpaikka</label>
        <div class="location-search-wrap">
          <input type="text" id="location" name="location" placeholder="Kaupunki" data-i18n-placeholder="placeholder_city" autocomplete="off"
            role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="location-suggestions" aria-describedby="location-status" required>
          <div id="location-suggestions" class="location-suggestions hidden" role="listbox" aria-labelledby="location-label"></div>
        </div>
        <div id="location-status" class="field-status" aria-live="polite"></div>
      </div>
    </div>

    <p id="form-error" class="form-error hidden" role="alert"></p>

    <div class="submit-row">
      <button type="submit" class="submit-btn" id="create-chart-btn" data-i18n="create_chart" disabled>Luo kartta</button>
    </div>

  </form>
</div>


<!-- ═══════════════════════════════════════════════════
     VIEW 2 — CHART (hidden initially)
     ═══════════════════════════════════════════════════ -->
<div id="chart-view" class="chart-container hidden">

  <div class="chart-header">
    <p class="eyebrow" data-i18n="heading">Neljä pilaria</p>
    <h1 class="name" id="chart-date"></h1>
  </div>

  <section id="day-master-context" class="day-master-context" aria-labelledby="day-master-heading">
    <h2 id="day-master-heading"></h2>
    <div id="context-controls" class="context-controls"></div>
    <p id="context-status" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  </section>

  <section class="relationships" aria-labelledby="relationships-heading">
    <div class="reading-toolbar">
      <h2 id="relationships-heading" data-i18n="relationships">Yhteydet</h2>
      <button type="button" id="ten-gods-toggle" class="reading-toggle" aria-pressed="false" data-i18n="show_ten_gods">Näytä kymmenen jumalaa</button>
    </div>
    <div id="relationship-list" class="relationship-list"></div>
    <p id="relationship-empty" class="relationship-empty hidden" data-i18n="relationship_empty"></p>
    <p id="relationship-status" class="sr-only" aria-live="polite" aria-atomic="true"></p>
  </section>

  <div class="pillars" id="pillars"></div>

  <section id="relationship-detail" class="relationship-detail hidden" aria-labelledby="relationship-detail-title"></section>

  <section id="context-detail" class="relationship-detail context-detail hidden" aria-labelledby="context-detail-title"></section>

  <div class="back-row">
    <button id="back-btn" class="back-btn" data-i18n="back">Takaisin</button>
  </div>

</div>

<script src="/static/localization.js?v={{ app_version }}"></script>
<script src="/static/relationships.js?v={{ app_version }}"></script>
<script src="/static/roles.js?v={{ app_version }}"></script>
<script src="/static/day-master-context.js?v={{ app_version }}"></script>
<script src="/static/app.js?v={{ app_version }}"></script>
</body>
</html>
