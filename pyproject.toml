[build-system]
requires = ['setuptools>=68', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'eight-characters'
version = '0.11.0'
description = 'BaZi Four Pillars chart generator'
readme = 'README.md'
requires-python = '>=3.9'
dependencies = [
  'fastapi>=0.115.0',
  'uvicorn>=0.34.0',
  'jinja2>=3.1.0',
  'pydantic>=2.0.0',
  'tzdata>=2024.1',
  'httpx>=0.27.0',
  'lunar-python>=1.4.8',
  'numpy==2.4.2',
]

[tool.setuptools.packages.find]
include = ['eight_characters*']

[tool.setuptools.package-data]
eight_characters = ['templates/*.html', 'static/*.css', 'static/*.js']

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "venv",
  "eight_characters.egg-info",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "UP",   # pyupgrade
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # keep long reference strings and URLs as-is
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "BLE001", "PLR2004", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["eight_characters"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = [
  "eight_characters",
]
exclude = [
  "**/__pycache__",
  ".venv",
  "venv",
  "eight_characters.egg-info",
]
venvPath = "."
venv = ".venv"
reportMissingImports = true
