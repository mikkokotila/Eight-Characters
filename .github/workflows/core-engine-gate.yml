name: core-engine-gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  core-engine-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run core engine tests
        run: |
          python -m unittest \
            tests.test_phase1_baseline \
            tests.test_phase2_time_normalization \
            tests.test_phase3_astronomical_kernel \
            tests.test_phase4_boundary_and_pillars \
            tests.test_phase5_integrity_output
