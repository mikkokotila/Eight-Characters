name: evolution-pipeline-gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  evolution-pipeline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run evolution pipeline tests
        run: |
          python -m unittest \
            tests.test_evolution_module_a_state \
            tests.test_evolution_module_b_families \
            tests.test_evolution_module_c_primitives \
            tests.test_evolution_module_d_mechanics \
            tests.test_evolution_module_e_energy \
            tests.test_evolution_module_f_inference \
            tests.test_evolution_module_g_postprocess \
            tests.test_evolution_module_h_pipeline
